<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Maison Élixir</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #1D1915 0%, #0E0C0A 75%);
      color: #F4EFE6;
      font-family: 'Outfit', sans-serif;
      padding: 20px;
    }

    .login-card {
      background: rgba(21, 18, 16, 0.92);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(197, 168, 128, 0.25);
      border-radius: 28px;
      padding: 55px 45px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes revealUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #F4EFE6;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 0.75rem;
      color: #C5A880;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-weight: 700;
    }

    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #C5A880;
    }

    .form-group input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #F4EFE6;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input::placeholder {
      color: rgba(244, 239, 230, 0.3);
    }

    .form-group input:focus {
      border-color: #C5A880;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 15px rgba(197, 168, 128, 0.2);
    }

    .btn-login {
      background: linear-gradient(135deg, #C5A880 0%, #A88B63 100%);
      color: #0E0C0A;
      border: none;
      border-radius: 100px;
      padding: 18px 30px;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      width: 100%;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(197, 168, 128, 0.35);
      background: linear-gradient(135deg, #D4B68D 0%, #B79A70 100%);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      color: #E74C3C;
      font-size: 0.85rem;
      margin-top: 10px;
      text-align: center;
      display: none;
      font-weight: 600;
      background: rgba(231, 76, 60, 0.12);
      border: 1px solid rgba(231, 76, 60, 0.3);
      padding: 14px;
      border-radius: 14px;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">MAISON ÉLIXIR</div>
      <div class="login-subtitle">Admin Portal Access</div>
    </div>
    <form id="login-form" class="admin-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="admin@maisonelixir.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login" id="login-btn">Secure Entry</button>
      <div id="error-msg" class="error-msg"></div>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://myrqlqstzakmnxfenlzg.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15cnFscXN0emFrbW54ZmVubHpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzczMTAsImV4cCI6MjEwMTQ1MzMxMH0.OovcIHrIY30kAVs2CU1DI6nhU6tpVpD0N4QHTSAY2ss';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginForm = document.getElementById('login-form');
    const errorEl = document.getElementById('error-msg');
    const btn = document.getElementById('login-btn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Authenticating...';
      errorEl.style.display = 'none';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        let msg = error.message;
        if (msg.includes('Invalid login credentials')) {
          msg = 'Invalid email or password. Ensure your user is created & confirmed in your Supabase Auth dashboard.';
        }
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Secure Entry';
      } else {
        localStorage.setItem('admin_last_action', Date.now());
        window.location.href = 'index.html';
      }
    });

    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = 'index.html';
    }
    checkAuth();
  </script>
</body>

</html>
